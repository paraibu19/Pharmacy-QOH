<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141414;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7941D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F27D26;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- New subtle inner glow -->
  <circle cx="256" cy="256" r="220" fill="white" opacity="0.02"/>
  
  <!-- Glossy Overlay -->
  <path d="M512 100C512 40 450 0 380 0H120C50 0 0 40 0 100V200C160 170 340 230 512 140V100Z" fill="white" opacity="0.04"/>
  
  <!-- Pharmacy Cross -->
  <g transform="translate(256, 256)">
    <!-- Main Cross Body -->
    <rect x="-130" y="-40" width="260" height="80" rx="40" fill="url(#iconGrad)"/>
    <rect x="-40" y="-130" width="80" height="260" rx="40" fill="url(#iconGrad)"/>
    
    <!-- Inner Cross Detail (White) -->
    <rect x="-100" y="-10" width="200" height="20" rx="10" fill="white" opacity="0.2"/>
    <rect x="-10" y="-100" width="20" height="200" rx="10" fill="white" opacity="0.2"/>
  </g>
  
  <!-- Subtle Border -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="#F27D26" stroke-width="2" opacity="0.1"/>
</svg>
