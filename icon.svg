<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141414;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7941D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F27D26;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Stylized Icon Container -->
  <g filter="url(#shadow)">
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#iconGrad)" stroke-width="8" stroke-dasharray="10 20" opacity="0.3"/>
    
    <!-- Central Pill/Cross Hybrid -->
    <rect x="232" y="140" width="48" height="232" rx="24" fill="url(#iconGrad)"/>
    <rect x="140" y="232" width="232" height="48" rx="24" fill="url(#iconGrad)"/>
    
    <!-- Inner Highlight -->
    <path d="M244 150V256H150" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.4" fill="none"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#F27D26" text-anchor="middle" letter-spacing="4" opacity="0.8">AW PHARMA</text>
</svg>
