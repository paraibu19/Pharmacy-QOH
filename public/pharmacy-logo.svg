<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141414;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7941D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F27D26;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Glossy Reflection -->
  <path d="M0 120C0 53.7 53.7 0 120 0H392C458.3 0 512 53.7 512 120V180C300 240 100 150 0 220V120Z" fill="white" opacity="0.04"/>

  <!-- Pharmacy Symbol: Modern Pill -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Pill Base -->
    <rect x="-140" y="-60" width="280" height="120" rx="60" fill="url(#brandGrad)"/>
    <!-- Pill Divider -->
    <rect x="-4" y="-60" width="8" height="120" fill="#141414" opacity="0.1"/>
    <!-- Pill Highlight -->
    <path d="M-80 -30 Q -120 -30 -120 0" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.2" fill="none"/>
  </g>

  <!-- Pharmacy Cross (Plus) -->
  <g transform="translate(380, 130)">
    <circle r="65" fill="#F27D26" opacity="0.2"/>
    <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#F27D26"/>
    <rect x="-10" y="-35" width="20" height="70" rx="10" fill="#F27D26"/>
  </g>
  
  <!-- Subtle Border -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="#F27D26" stroke-width="3" opacity="0.15"/>
</svg>
